spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: orderflow
    password: orderflow123
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

jwt:
  secret: ${JWT_SECRET}
  expiration:
    accessToken: 3600000
    refreshToken: 604800000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

# Elasticsearch 커스텀 설정
elasticsearch:
  host: localhost
  port: 9200
  enabled: true  # Elasticsearch 활성화/비활성화

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.example.product: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE