# Worker 프로세스 설정
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 이벤트 처리 설정
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # 기본 설정
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 형식
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 성능 최적화
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate Limiting (전역 설정)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # API Gateway 업스트림
    upstream api_gateway {
        # 로드 밸런싱 알고리즘: least_conn (최소 연결)
        least_conn;

        # API Gateway 인스턴스들
        server api-gateway-1:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8080 max_fails=3 fail_timeout=30s;

        # Keep-Alive 연결 유지
        keepalive 32;
    }

    # HTTP 서버 (80 포트)
    server {
        listen 80;
        server_name localhost api.orderflow.com;  # localhost 추가 (개발용)

        # 클라이언트 설정
        client_max_body_size 10M;

        # HTTP -> HTTPS 리다이렉트 (운영 환경에서 활성화)
        # return 301 https://$server_name$request_uri;

        # 메인 API 프록시
        location / {
            # Rate Limiting 적용
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://api_gateway;

            # 헤더 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 버퍼 설정
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # WebSocket 지원
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health Check (로드 밸런서용)
        location /health {
            access_log off;
            proxy_pass http://api_gateway/actuator/health;
            proxy_set_header Host $host;
        }

        # 정적 파일
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 로그
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
    }

