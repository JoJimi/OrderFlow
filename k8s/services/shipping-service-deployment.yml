apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: orderflow
  name: orderflow-shipping-service
  labels:
    part-of: orderflow
    component: backend-server
    name: shipping-service
    instance: orderflow-shipping-service
    version: "1.0.0"
    managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      part-of: orderflow
      component: backend-server
      name: shipping-service
      instance: orderflow-shipping-service
  template:
    metadata:
      labels:
        part-of: orderflow
        component: backend-server
        name: shipping-service
        instance: orderflow-shipping-service
        version: "1.0.0"
    spec:
      containers:
        - name: shipping-service
          image: jimineutron/orderflow-shipping-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secret
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server:8761/eureka/"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"