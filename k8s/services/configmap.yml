apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "prod"

  # Database
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_POOL_SIZE: "10"
  DB_MIN_IDLE: "2"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Eureka
  EUREKA_SERVER_URL: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_HOSTNAME: "${HOSTNAME}"

  # Frontend
  FRONT_BASE_URL: "http://localhost:3000"