apiVersion: v1
kind: Service
metadata:
  namespace: orderflow
  name: product-service
  labels:
    part-of: orderflow
    component: backend-server
    name: product-service
    instance: orderflow-product-service
    version: "1.0.0"
    managed-by: kubectl
spec:
  selector:
    part-of: orderflow
    component: backend-server
    name: product-service
    instance: orderflow-product-service
  ports:
    - port: 8082
      targetPort: http
      name: http
  type: ClusterIP