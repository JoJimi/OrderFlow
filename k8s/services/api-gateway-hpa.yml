apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: orderflow
  name: orderflow-api-gateway-hpa
  labels:
    part-of: orderflow
    component: gateway
    name: api-gateway
    instance: orderflow-api-gateway
    version: "1.0.0"
    managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orderflow-api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120