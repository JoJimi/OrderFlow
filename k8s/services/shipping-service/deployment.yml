apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
    spec:
      containers:
        - name: shipping-service
          image: jimineutron/orderflow-shipping-service:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: orderflow-config
            - secretRef:
                name: orderflow-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-service
  namespace: orderflow
spec:
  selector:
    app: shipping-service
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
