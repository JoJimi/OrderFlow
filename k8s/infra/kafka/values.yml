# Kafka Helm values for OrderFlow (Bitnami chart)
listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

controller:
  replicaCount: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

broker:
  replicaCount: 0

kraft:
  enabled: true

zookeeper:
  enabled: false

provisioning:
  enabled: true
  topics:
    - name: order-events
      partitions: 3
      replicationFactor: 1
    - name: payment-events
      partitions: 3
      replicationFactor: 1
    - name: inventory-events
      partitions: 3
      replicationFactor: 1
    - name: shipping-events
      partitions: 3
      replicationFactor: 1
    - name: product-events
      partitions: 3
      replicationFactor: 1
    - name: notification-events
      partitions: 3
      replicationFactor: 1