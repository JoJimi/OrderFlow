apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orderflow
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: kafka-init
          image: confluentinc/cp-kafka:7.5.0
          command:
            - sh
            - -c
            - |
              if [ ! -f /var/lib/kafka/data/.formatted ]; then
                echo "Formatting KRaft storage..."
                cat > /tmp/kraft.properties << EOF
              node.id=1
              process.roles=broker,controller
              controller.listener.names=CONTROLLER
              controller.quorum.voters=1@localhost:9093
              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
              advertised.listeners=PLAINTEXT://kafka:9092
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              inter.broker.listener.name=PLAINTEXT
              log.dirs=/var/lib/kafka/data
              EOF
                kafka-storage format -t MkU3OEVBNTcwNTJENDM2Qk -c /tmp/kraft.properties --ignore-formatted
                touch /var/lib/kafka/data/.formatted
                echo "Format complete."
              else
                echo "Already formatted, skipping."
              fi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          command:
            - sh
            - -c
            - |
              # 설정 파일 생성
              cat > /tmp/server.properties << EOF
              node.id=1
              process.roles=broker,controller
              controller.listener.names=CONTROLLER
              controller.quorum.voters=1@localhost:9093
              listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
              advertised.listeners=PLAINTEXT://kafka:9092
              listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
              inter.broker.listener.name=PLAINTEXT
              log.dirs=/var/lib/kafka/data
              offsets.topic.replication.factor=1
              transaction.state.log.replication.factor=1
              transaction.state.log.min.isr=1
              auto.create.topics.enable=true
              EOF
              
              # Kafka 직접 실행
              exec kafka-server-start /tmp/server.properties
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-pvc