apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: orderflow
data:
  init-databases.sql: |
    -- 데이터베이스 생성
    CREATE DATABASE user_db;
    CREATE DATABASE product_db;
    CREATE DATABASE order_db;
    CREATE DATABASE payment_db;
    CREATE DATABASE inventory_db;
    CREATE DATABASE shipping_db;
    CREATE DATABASE notification_db;
    CREATE DATABASE event_logging_db;
    
    -- 각 데이터베이스에 연결하여 권한 부여
    \c user_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c product_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c order_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c payment_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c inventory_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c shipping_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c notification_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    \c event_logging_db;
    GRANT ALL PRIVILEGES ON SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO orderflow;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO orderflow;
    
    -- ========================================
    -- User Service Database (user_db)
    -- ========================================
    \c user_db;
    
    DROP TABLE IF EXISTS users CASCADE;
    
    CREATE TABLE users (
    id BIGSERIAL PRIMARY KEY,
    email VARCHAR(100) NOT NULL,
    provider_id VARCHAR(100) NOT NULL,
    nickname VARCHAR(50),
    login_type VARCHAR(20) NOT NULL,
    role_type VARCHAR(20) NOT NULL DEFAULT 'ROLE_USER',
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT uq_user_login_provider UNIQUE (login_type, provider_id)
    );
    
    CREATE INDEX idx_email ON users(email);
    CREATE INDEX idx_role ON users(role_type);
    
    -- ========================================
    -- Product Service Database (product_db)
    -- ========================================
    \c product_db;
    
    DROP TABLE IF EXISTS products CASCADE;
    
    CREATE TABLE products (
    product_id VARCHAR(50) PRIMARY KEY,
    product_name VARCHAR(255) NOT NULL,
    description TEXT,
    price DECIMAL(10, 2) NOT NULL,
    category VARCHAR(50) NOT NULL,
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_category ON products(category);
    CREATE INDEX idx_is_deleted ON products(deleted);
    CREATE INDEX idx_created_at ON products(created_at);
    
    -- ========================================
    -- Order Service Database (order_db)
    -- ========================================
    \c order_db;
    
    DROP TABLE IF EXISTS order_items CASCADE;
    DROP TABLE IF EXISTS orders CASCADE;
    
    CREATE TABLE orders (
    order_id VARCHAR(50) PRIMARY KEY,
    user_id VARCHAR(50) NOT NULL,
    total_price DECIMAL(12, 2) NOT NULL,
    order_status VARCHAR(30) NOT NULL DEFAULT 'ORDER_CREATED',
    shipping_address VARCHAR(500) NOT NULL,
    shipping_city VARCHAR(100),
    shipping_postal_code VARCHAR(20),
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_user_id ON orders(user_id);
    CREATE INDEX idx_order_status ON orders(order_status);
    CREATE INDEX idx_created_at ON orders(created_at);
    
    CREATE TABLE order_items (
    order_item_id VARCHAR(50) PRIMARY KEY,
    order_id VARCHAR(50) NOT NULL,
    product_id VARCHAR(50) NOT NULL,
    quantity INTEGER NOT NULL,
    unit_price DECIMAL(10, 2) NOT NULL,
    subtotal DECIMAL(12, 2) NOT NULL,
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT fk_order_item_order FOREIGN KEY (order_id) REFERENCES orders(order_id) ON DELETE CASCADE
    );
    
    CREATE INDEX idx_order_id ON order_items(order_id);
    CREATE INDEX idx_product_id ON order_items(product_id);
    
    -- ========================================
    -- Payment Service Database (payment_db)
    -- ========================================
    \c payment_db;
    
    DROP TABLE IF EXISTS payments CASCADE;
    
    CREATE TABLE payments (
    payment_id VARCHAR(50) PRIMARY KEY,
    order_id VARCHAR(50) NOT NULL,
    user_id VARCHAR(50) NOT NULL,
    amount DECIMAL(12, 2) NOT NULL,
    payment_status VARCHAR(30) NOT NULL DEFAULT 'PAYMENT_PENDING',
    payment_method VARCHAR(30),
    transaction_id VARCHAR(100),
    failure_reason VARCHAR(500),
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_order_id ON payments(order_id);
    CREATE INDEX idx_user_id ON payments(user_id);
    CREATE INDEX idx_payment_status ON payments(payment_status);
    CREATE INDEX idx_created_at ON payments(created_at);
    
    -- ========================================
    -- Inventory Service Database (inventory_db)
    -- ========================================
    \c inventory_db;
    
    DROP TABLE IF EXISTS inventory_logs CASCADE;
    DROP TABLE IF EXISTS inventory CASCADE;
    
    CREATE TABLE inventory (
    inventory_id VARCHAR(50) PRIMARY KEY,
    product_id VARCHAR(50) NOT NULL UNIQUE,
    total_stock INTEGER NOT NULL DEFAULT 0,
    reserved_stock INTEGER NOT NULL DEFAULT 0,
    available_stock INTEGER NOT NULL DEFAULT 0,
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    last_updated TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT uq_product_id UNIQUE (product_id)
    );
    
    CREATE INDEX idx_inventory_product_id ON inventory(product_id);
    CREATE INDEX idx_inventory_last_updated ON inventory(last_updated);
    
    CREATE TABLE inventory_logs (
    log_id VARCHAR(50) PRIMARY KEY,
    inventory_id VARCHAR(50) NOT NULL,
    product_id VARCHAR(50) NOT NULL,
    action VARCHAR(30) NOT NULL,
    quantity INTEGER NOT NULL,
    reason VARCHAR(500),
    order_id VARCHAR(50),
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    timestamp TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT fk_inventory_log_inventory FOREIGN KEY (inventory_id) REFERENCES inventory(inventory_id) ON DELETE CASCADE
    );
    
    CREATE INDEX idx_log_inventory_id ON inventory_logs(inventory_id);
    CREATE INDEX idx_log_product_id ON inventory_logs(product_id);
    CREATE INDEX idx_log_order_id ON inventory_logs(order_id);
    CREATE INDEX idx_log_timestamp ON inventory_logs(timestamp);
    
    -- ========================================
    -- Shipping Service Database (shipping_db)
    -- ========================================
    \c shipping_db;
    
    DROP TABLE IF EXISTS shipments CASCADE;
    
    CREATE TABLE shipments (
    shipment_id VARCHAR(50) PRIMARY KEY,
    order_id VARCHAR(50) NOT NULL UNIQUE,
    user_id VARCHAR(50) NOT NULL,
    shipping_status VARCHAR(30) NOT NULL DEFAULT 'SHIPPING_PREPARING',
    tracking_number VARCHAR(100),
    carrier VARCHAR(50),
    estimated_delivery_date DATE,
    actual_delivery_date TIMESTAMP,
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT uq_order_id UNIQUE (order_id)
    );
    
    CREATE INDEX idx_order_id ON shipments(order_id);
    CREATE INDEX idx_shipping_status ON shipments(shipping_status);
    CREATE INDEX idx_tracking_number ON shipments(tracking_number);
    
    -- ========================================
    -- Notification Service Database (notification_db)
    -- ========================================
    \c notification_db;
    
    DROP TABLE IF EXISTS notifications CASCADE;
    
    CREATE TABLE notifications (
    notification_id VARCHAR(50) PRIMARY KEY,
    user_id VARCHAR(50) NOT NULL,
    message VARCHAR(1000) NOT NULL,
    notification_type VARCHAR(30) NOT NULL,
    is_read BOOLEAN NOT NULL DEFAULT FALSE,
    related_order_id VARCHAR(50),
    read_at TIMESTAMP,
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_user_id ON notifications(user_id);
    CREATE INDEX idx_order_id ON notifications(related_order_id);
    CREATE INDEX idx_notification_type ON notifications(notification_type);
    CREATE INDEX idx_is_read ON notifications(is_read);
    CREATE INDEX idx_created_at ON notifications(created_at);
    
    -- ========================================
    -- Event Logging Service Database (event_logging_db)
    -- ========================================
    \c event_logging_db;
    
    DROP TABLE IF EXISTS event_logs CASCADE;
    
    CREATE TABLE event_logs (
    event_id VARCHAR(50) PRIMARY KEY,
    order_id VARCHAR(50),
    event_type VARCHAR(50) NOT NULL,
    event_data TEXT,
    service VARCHAR(50) NOT NULL,
    status VARCHAR(20) NOT NULL DEFAULT 'SUCCESS',
    deleted BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    
    CREATE INDEX idx_order_id ON event_logs(order_id);
    CREATE INDEX idx_event_type ON event_logs(event_type);
    CREATE INDEX idx_service ON event_logs(service);
    CREATE INDEX idx_status ON event_logs(status);
    CREATE INDEX idx_created_at ON event_logs(created_at);
    
    \c postgres;
    SELECT 'OrderFlow 데이터베이스 초기화 완료!' as message;