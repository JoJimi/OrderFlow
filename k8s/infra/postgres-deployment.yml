apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: orderflow
  name: orderflow-postgres
  labels:
    part-of: orderflow
    component: database
    name: postgres
    instance: orderflow-postgres
    version: "15"
    managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      part-of: orderflow
      component: database
      name: postgres
      instance: orderflow-postgres
  template:
    metadata:
      labels:
        part-of: orderflow
        component: database
        name: postgres
        instance: orderflow-postgres
        version: "15"
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "orderflow"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orderflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: orderflow-postgres-data