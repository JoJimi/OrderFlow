apiVersion: v1
kind: ConfigMap
metadata:
  namespace: orderflow
  name: orderflow-config
  labels:
    part-of: orderflow
    component: config
    name: orderflow-config
    version: "1.0.0"
    managed-by: kubectl
data:
  # Database
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "orderflow"
  DB_POOL_SIZE: "20"
  DB_MIN_IDLE: "5"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # Eureka
  EUREKA_SERVER_URL: "http://eureka-server:8761/eureka/"

  # Spring
  SPRING_PROFILES_ACTIVE: "prod"

  # JWT Expiration (non-sensitive)
  JWT_ACCESS_EXPIRATION: "1800000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # Frontend
  FRONT_BASE_URL: "http://localhost:3000"