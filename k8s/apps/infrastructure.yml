apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: orderflow
  namespace: argocd
spec:
  description: OrderFlow E-commerce Project
  sourceRepos:
    - 'https://github.com/JoJimi/OrderFlow'
  destinations:
    - namespace: orderflow
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JoJimi/OrderFlow
    targetRevision: develop
    path: k8s/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: orderflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName