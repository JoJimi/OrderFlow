spring:
  application:
    name: order-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/order_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 2
      timeout: 3000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: order-service-group

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/

  cloud:
    openfeign:
      client:
        config:
          product-service:
            logger-level: full
            read-timeout: 3000
            connect-timeout: 1000
          inventory-service:
            logger-level: full
            read-timeout: 3000
            connect-timeout: 1000
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      ProductClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      InventoryClient:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  timelimiter:
    instances:
      ProductClient:
        timeout-duration: 3s
      InventoryClient:
        timeout-duration: 3s
  bulkhead:
    instances:
      ProductClient:
        max-concurrent-calls: 20
        max-wait-duration: 100ms
      InventoryClient:
        max-concurrent-calls: 20
        max-wait-duration: 100ms

server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
  shutdown: graceful

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    metadata-map:
      management.port: ${management.server.port}

management:
  server:
    port: 9083
  endpoints:
    web:
      base-path: /actuator
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/order-service.log
    max-size: 10MB
    max-history: 30