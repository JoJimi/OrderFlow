spring:
  application:
    name: order-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/order_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 2
      timeout: 3000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: order-service-group

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/

  task:
    scheduling:
      pool:
        size: 5

  cloud:
    openfeign:
      client:
        config:
          product-service:
            logger-level: full
            read-timeout: 5000            # 상품 정보를 줄 때까지 5초 기다림
            connect-timeout: 5000
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3s
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      ProductClient:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 4s
    instances:
      ProductClient:
        base-config: default

  bulkhead:
    configs:
      default:
        max-concurrent-calls: 50
        max-wait-duration: 500ms
    instances:
      ProductClient:
        base-config: default

server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
  shutdown: graceful

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30           # 30초마다 나 살아 있어 라는 신호를 보냄
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30         # 30초마다 나 살아 있어 라는 신호를 보냄
    lease-expiration-duration-in-seconds: 90      # 근데 내 소식이 90초 동안 안들리면 죽은 것으로 간주해줘!
    metadata-map:
      management.port: ${management.server.port}

management:
  server:
    port: 9083
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics  # Prometheus 메트릭 노출
    health:
      livenessState:
        enabled: true
      readinessState:
        enabled: true
    metrics:
      tags:
        application: ${spring.application.name}
      export:
        prometheus:
          enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/order-service.log
    max-size: 10MB
    max-history: 30