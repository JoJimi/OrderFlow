spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: orderflow
    password: orderflow123
    hikari:
      maximum-pool-size: 100          # 동시에 DB에 접근할 수 있는 수 (아직 단일 서버라 100개 유지)
      minimum-idle: 20
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: latest

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration:
    accessToken: 3600000
    refreshToken: 604800000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.example.order: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO