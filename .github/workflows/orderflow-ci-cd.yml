name: Build & Deploy to Kubernetes with ArgoCD

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'user-service/**'
      - 'product-service/**'
      - 'inventory-service/**'
      - 'shared/**'
      - '.github/workflows/**'
  push:
    branches: [ "develop" ]
    paths:
      - 'user-service/**'
      - 'product-service/**'
      - 'inventory-service/**'
      - 'shared/**'

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ========================================
  # 1. 변경사항 감지 (Change Detection)
  # ========================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.changes.outputs.user-service }}
      product-service: ${{ steps.changes.outputs.product-service }}
      inventory-service: ${{ steps.changes.outputs.inventory-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # develop 브랜치와 현재 브랜치의 diff 확인
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="origin/develop"
          fi

          # user-service 변경 여부
          if git diff $BASE_REF HEAD --quiet -- user-service/ shared/; then
            echo "user-service=false" >> $GITHUB_OUTPUT
          else
            echo "user-service=true" >> $GITHUB_OUTPUT
          fi

          # product-service 변경 여부
          if git diff $BASE_REF HEAD --quiet -- product-service/ shared/; then
            echo "product-service=false" >> $GITHUB_OUTPUT
          else
            echo "product-service=true" >> $GITHUB_OUTPUT
          fi

          # inventory-service 변경 여부
          if git diff $BASE_REF HEAD --quiet -- inventory-service/ shared/; then
            echo "inventory-service=false" >> $GITHUB_OUTPUT
          else
            echo "inventory-service=true" >> $GITHUB_OUTPUT
          fi

  # ========================================
  # 2. 빌드 (Build)
  # ========================================
  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create .env file
        run: |
          touch .env
          cat > .env << EOF
          SPRING_PROFILES_ACTIVE=dev
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Build with Gradle (전체 프로젝트)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
          SPRING_PROFILES_ACTIVE: dev
        run: ./gradlew clean build -x test

      - name: Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_PROFILES_ACTIVE: dev
        run: ./gradlew test

  # ========================================
  # 3. Docker 이미지 빌드 & 푸시
  # ========================================
  build-and-push-user-service:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.user-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-user-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push user-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-user-service:latest
            ${{ env.REGISTRY }}/jimineutron/orderflow-user-service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=user-service
          cache-from: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-user-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-user-service:buildcache,mode=max

  build-and-push-product-service:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.product-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-product-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push product-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-product-service:latest
            ${{ env.REGISTRY }}/jimineutron/orderflow-product-service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=product-service
          cache-from: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-product-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-product-service:buildcache,mode=max

  build-and-push-inventory-service:
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.inventory-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-inventory-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push inventory-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/jimineutron/orderflow-inventory-service:latest
            ${{ env.REGISTRY }}/jimineutron/orderflow-inventory-service:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=inventory-service
          cache-from: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-inventory-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/jimineutron/orderflow-inventory-service:buildcache,mode=max

  # ========================================
  # 4. Kubernetes 매니페스트 업데이트 (GitOps)
  # ========================================
  update-manifests:
    needs: [detect-changes, build-and-push-user-service, build-and-push-product-service, build-and-push-inventory-service]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout k8s-orderflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: k8s-repo
          ref: develop

      - name: Update user-service manifest
        if: needs.detect-changes.outputs.user-service == 'true'
        run: |
          cd k8s-repo
          
          # kustomization.yaml에서 이미지 태그 업데이트
          kustomize edit set image jimineutron/orderflow-user-service:latest=jimineutron/orderflow-user-service:${{ github.sha }}
          
          # 또는 직접 yaml 파일 수정
          sed -i 's|jimineutron/orderflow-user-service:.*|jimineutron/orderflow-user-service:${{ github.sha }}|g' k8s-orderflow/services/user-service.yaml

      - name: Update product-service manifest
        if: needs.detect-changes.outputs.product-service == 'true'
        run: |
          cd k8s-repo
          sed -i 's|jimineutron/orderflow-product-service:.*|jimineutron/orderflow-product-service:${{ github.sha }}|g' k8s-orderflow/services/product-service.yaml

      - name: Update inventory-service manifest
        if: needs.detect-changes.outputs.inventory-service == 'true'
        run: |
          cd k8s-repo
          sed -i 's|jimineutron/orderflow-inventory-service:.*|jimineutron/orderflow-inventory-service:${{ github.sha }}|g' k8s-orderflow/services/inventory-service.yaml

      - name: Commit and push manifest updates
        run: |
          cd k8s-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add k8s-orderflow/services/*.yaml
          git commit -m "🔄 Update image tags to ${{ github.sha }}" || echo "No changes to commit"
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # 5. ArgoCD 동기화 (Optional - webhook 대신)
  # ========================================
  argocd-sync:
    needs: update-manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ArgoCD CLI 설치
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD 애플리케이션 동기화
        run: |
          argocd app sync orderflow \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }} \
            --grpc-web
        continue-on-error: true

  # ========================================
  # 6. 배포 알림 (Slack)
  # ========================================
  notify:
    needs: [ build, build-and-push-user-service, build-and-push-product-service, build-and-push-inventory-service ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determine build status
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "status=✅ 성공" >> $GITHUB_OUTPUT
            echo "color=#00FF00" >> $GITHUB_OUTPUT
          else
            echo "status=❌ 실패" >> $GITHUB_OUTPUT
            echo "color=#FF0000" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 OrderFlow 빌드 & 배포
            ${{ steps.status.outputs.status }}
            
            📋 변경사항:
            • user-service: ${{ needs.build-and-push-user-service.result }}
            • product-service: ${{ needs.build-and-push-product-service.result }}
            • inventory-service: ${{ needs.build-and-push-inventory-service.result }}
            
            🔗 Commit: ${{ github.sha }}
            👤 Author: ${{ github.actor }}
            📌 Branch: ${{ github.ref_name }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
