spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: orderflow
    password: orderflow123
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: latest

kafka:
  topics:
    order-event: order-event
    payment-event: payment-event
  consumer:
    # Consumer 처리 시뮬레이션 지연 시간 (밀리초)
    # 10ms = 초당 약 100개 처리 (concurrency=3이면 300개/s)
    # 50ms = 초당 약 20개 처리 (concurrency=3이면 60개/s)
    # 100ms = 초당 약 10개 처리 (concurrency=3이면 30개/s)
    processing-delay-ms: 10

jwt:
  secret: ${JWT_SECRET}
  expiration:
    accessToken: 3600000
    refreshToken: 604800000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.example.payment: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO