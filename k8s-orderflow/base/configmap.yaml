apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orderflow
    app.kubernetes.io/part-of: orderflow-system
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "prod"

  # Database Configuration
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "orderflow"
  DB_POOL_SIZE: "20"
  DB_MIN_IDLE: "5"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  # Eureka Configuration - DISABLED for Kubernetes
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
  EUREKA_CLIENT_FETCH_REGISTRY: "false"

  # JWT Expiration
  JWT_ACCESS_EXPIRATION: "1800000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # Frontend Base URL
  FRONT_BASE_URL: "http://localhost:3000"

  # Service URLs for inter-service communication (Kubernetes DNS)
  USER_SERVICE_URL: "http://user-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  INVENTORY_SERVICE_URL: "http://inventory-service:8085"

  # Feign Client Configuration (direct URLs instead of Eureka)
  PRODUCT_SERVICE_RIBBON_LISTOFSERVERS: "product-service:8082"
  USER_SERVICE_RIBBON_LISTOFSERVERS: "user-service:8081"
  INVENTORY_SERVICE_RIBBON_LISTOFSERVERS: "inventory-service:8085"

  # Actuator endpoints
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"