apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: orderflow-k8s

namespace: orderflow

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: orderflow-system

# Resources to include
resources:
  # Base configurations
  - base/namespace.yaml
  - base/configmap.yaml

  # Infrastructure services
  - infrastructure/postgres.yaml
  - infrastructure/redis.yaml
  - infrastructure/kafka.yaml

  # Application services
  - services/user-service.yaml
  - services/product-service.yaml
  - services/inventory-service.yaml

  # Monitoring stack
  - monitoring/prometheus-configmap.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

  # Ingress
  - base/ingress.yaml

# Image customization (can be overridden)
images:
  - name: jimineutron/orderflow-user-service
    newTag: latest
  - name: jimineutron/orderflow-product-service
    newTag: latest
  - name: jimineutron/orderflow-inventory-service
    newTag: latest
  - name: prom/prometheus
    newTag: latest
  - name: grafana/grafana
    newTag: latest