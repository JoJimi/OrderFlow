---
# Grafana Datasource ConfigMap (Updated with Loki)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: true
        version: 1
        jsonData:
          timeInterval: 15s

      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        isDefault: false
        editable: true
        version: 1
        jsonData:
          maxLines: 10000
          derivedFields:
            - datasourceUid: prometheus
              matcherRegex: 'trace_id=(\w+)'
              name: TraceID
              url: '$${__value.raw}'

---
# Grafana Datasource ConfigMap for Alloy (service discovery)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-alloy
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
data:
  alloy.yml: |
    apiVersion: 1
    datasources:
      - name: Alloy
        type: prometheus
        url: http://alloy:12345
        access: proxy
        isDefault: false
        editable: true
        version: 1
        jsonData:
          timeInterval: 15s

---
# Grafana Dashboard Provider ConfigMap for ALG Stack
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'OrderFlow Dashboards'
        orgId: 1
        folder: 'OrderFlow'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
      - name: 'ALG Stack Dashboards'
        orgId: 1
        folder: 'ALG Monitoring'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/alg

---
# Grafana Config ConfigMap (Updated)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config-alg
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
data:
  grafana.ini: |
    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning

    [server]
    root_url = http://%(domain)s:%(http_port)s/
    serve_from_sub_path = true
    http_addr = 0.0.0.0
    http_port = 3000
    protocol = http

    [security]
    admin_user = admin
    admin_password = admin123
    disable_gravatar = true
    secret_key = orderflow-secret-key

    [users]
    allow_sign_up = false
    auto_assign_org_role = Viewer

    [plugins]
    enable_alpha = true
    app_tls_skip_verify_insecure = true

    [database]
    type = sqlite3
    path = /var/lib/grafana/grafana.db

    [analytics]
    check_for_updates = false
    reporting_enabled = false

    [alerting]
    enabled = true
    execute_alerts = true

    [feature_toggles]
    lokiLogsDataplane = true
    traceqlEditor = true

---
# Grafana PersistentVolumeClaim (if not exists)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard

---
# Grafana Deployment (Updated)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        part-of: alg-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true

      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
            - name: GF_INSTALL_PLUGINS
              value: "grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-datasources-alloy
              mountPath: /etc/grafana/provisioning/datasources/alloy
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-config
              mountPath: /etc/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-datasources-alloy
          configMap:
            name: grafana-datasources-alloy
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
            optional: true
        - name: grafana-config
          configMap:
            name: grafana-config-alg

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Grafana Service (ClusterIP - Internal)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      protocol: TCP

---
# Grafana Service (NodePort - External)
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: orderflow
  labels:
    app: grafana
    part-of: alg-monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30301
      protocol: TCP