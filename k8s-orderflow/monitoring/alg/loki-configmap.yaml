---
# Loki ConfigMap (Loki 2.9.4 호환)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: orderflow
  labels:
    app: loki
    part-of: alg-monitoring
data:
  loki-config.yaml: |
    auth_enabled: false

    ingester:
      chunk_idle_period: 3m
      chunk_retain_period: 1m
      max_chunk_age: 1h
      chunk_encoding: snappy
      # 제거: max_streams_matchers_cache_bytes는 Loki 2.9.4에서 지원 안함

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_burst_size_mb: 20
      ingestion_rate_mb: 10
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 24h

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    server:
      http_listen_port: 3100
      log_level: info

    chunk_store_config:
      max_look_back_period: 0s

    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks

    # Query configuration (제거: max_samples는 Loki 2.9.4에서 지원 안함)
    querier:
      max_concurrent: 10

---
# Loki ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: orderflow
  labels:
    app: loki
    part-of: alg-monitoring