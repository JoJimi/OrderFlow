---
# Loki Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: orderflow
  labels:
    app: loki
    part-of: alg-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: loki
        part-of: alg-monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: loki
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true

      containers:
        - name: loki
          image: grafana/loki:2.9.4
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Seoul"
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: loki-config
          configMap:
            name: loki-config
            items:
              - key: loki-config.yaml
                path: local-config.yaml
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-pvc

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
# Loki Service (ClusterIP - Internal)
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: orderflow
  labels:
    app: loki
    part-of: alg-monitoring
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
  selector:
    app: loki

---
# Loki Service (NodePort - External)
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: orderflow
  labels:
    app: loki
    part-of: alg-monitoring
spec:
  type: NodePort
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 30300
      protocol: TCP
  selector:
    app: loki