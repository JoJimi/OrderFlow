{{- if .Values.userService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
spec:
  replicas: {{ .Values.userService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.userService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.userService.name }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 5
              done
              echo "PostgreSQL is ready!"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 5
              done
              echo "Redis is ready!"
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 29092; do
                echo "Waiting for Kafka..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: {{ .Values.userService.name }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.userService.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.userService.port }}
              name: http
          env:
            # Spring Profile
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: SPRING_PROFILES_ACTIVE

            # Database Configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql:5432/orderflow"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: DB_POOL_SIZE
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: DB_MIN_IDLE

            # Redis Configuration
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: REDIS_PORT

            # Kafka Configuration
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            # JWT Configuration
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: JWT_SECRET
            - name: JWT_ACCESS_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: JWT_ACCESS_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: JWT_REFRESH_EXPIRATION

            # OAuth2 - Google
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: GOOGLE_CLIENT_ID
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: GOOGLE_CLIENT_SECRET

            # OAuth2 - Kakao
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: KAKAO_CLIENT_ID
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: KAKAO_CLIENT_SECRET

            # Admin Configuration
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: ADMIN_EMAILS

            # Frontend URL
            - name: FRONT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: FRONT_BASE_URL
          resources:
            requests:
              memory: {{ .Values.userService.resources.requests.memory }}
              cpu: {{ .Values.userService.resources.requests.cpu }}
            limits:
              memory: {{ .Values.userService.resources.limits.memory }}
              cpu: {{ .Values.userService.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: {{ .Values.userService.healthcheck.path }}
              port: {{ .Values.userService.port }}
            initialDelaySeconds: {{ .Values.userService.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.userService.healthcheck.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.userService.healthcheck.path }}
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.userService.name }}
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
spec:
  type: {{ .Values.userService.service.type }}
  ports:
    - port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
      {{- if eq .Values.userService.service.type "NodePort" }}
      nodePort: {{ .Values.userService.service.nodePort }}
      {{- end }}
      name: http
  selector:
    app: {{ .Values.userService.name }}
---
{{- if .Values.userService.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.userService.name }}-hpa
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
    app: {{ .Values.userService.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.userService.name }}
  minReplicas: {{ .Values.userService.hpa.minReplicas }}
  maxReplicas: {{ .Values.userService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.userService.hpa.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.userService.hpa.targetMemoryUtilization }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- end }}
{{- end }}