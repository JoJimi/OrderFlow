  {{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka
    component: messaging
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.infrastructure }}"
spec:
  serviceName: kafka
  replicas: {{ .Values.kafka.brokerCount }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: kafka-internal
              containerPort: 29092
              protocol: TCP
            - name: kafka-external
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # KRaft 필수 설정
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # Listener 설정
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-0.kafka:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka:29092,PLAINTEXT_HOST://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # 클러스터 설정
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # 로그 설정
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "1073741824"

            # Cluster ID (고유값)
            - name: CLUSTER_ID
              value: "MkU3OEVCNTcwNTJENDM2Qk"

          resources:
            requests:
              memory: {{ .Values.kafka.resources.requests.memory }}
              cpu: {{ .Values.kafka.resources.requests.cpu }}
            limits:
              memory: {{ .Values.kafka.resources.limits.memory }}
              cpu: {{ .Values.kafka.resources.limits.cpu }}

          livenessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions
                - --bootstrap-server=localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kraft-combined-logs

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    kafka-broker-api-versions --bootstrap-server=localhost:9092 || true

      terminationGracePeriodSeconds: 60

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.kafka.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}
              {{- end }}