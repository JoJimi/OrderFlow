  {{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    app: kafka
    component: messaging
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.infrastructure }}"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: kafka-internal
      port: 29092
      targetPort: 29092
      protocol: TCP
    - name: kafka-external
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP
        {{- end }}