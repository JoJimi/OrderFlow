{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow-ingress
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: orderflow-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # User Service Routes
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.userService.name }}
                port:
                  number: {{ .Values.userService.port }}
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.userService.name }}
                port:
                  number: {{ .Values.userService.port }}

          # Product Service Routes
          - path: /api/products(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.productService.name }}
                port:
                  number: {{ .Values.productService.port }}

          # Inventory Service Routes
          - path: /api/inventory(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.inventoryService.name }}
                port:
                  number: {{ .Values.inventoryService.port }}
---
# Health Check Ingress (without rewrite)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderflow-health-ingress
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Health endpoints
          - path: /health/user
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.userService.name }}
                port:
                  number: {{ .Values.userService.port }}
          - path: /health/product
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.productService.name }}
                port:
                  number: {{ .Values.productService.port }}
          - path: /health/inventory
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.inventoryService.name }}
                port:
                  number: {{ .Values.inventoryService.port }}
{{- end }}