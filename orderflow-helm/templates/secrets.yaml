apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # Redis
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}

  # JWT Configuration
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_ACCESS_EXPIRATION: {{ .Values.secrets.jwtAccessExpiration | quote }}
  JWT_REFRESH_EXPIRATION: {{ .Values.secrets.jwtRefreshExpiration | quote }}

  # Google OAuth2
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}

  # Kakao OAuth2
  KAKAO_CLIENT_ID: {{ .Values.secrets.kakaoClientId | quote }}
  KAKAO_CLIENT_SECRET: {{ .Values.secrets.kakaoClientSecret | quote }}

  # Admin Configuration
  ADMIN_EMAILS: {{ .Values.secrets.adminEmails | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: {{ include "orderflow.namespace" . }}
  labels:
    {{- include "orderflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: "orderflow"