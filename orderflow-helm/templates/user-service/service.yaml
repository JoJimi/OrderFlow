  {{- if .Values.userService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: {{ .Values.namespace }}
  labels:
    app: user-service
    component: service
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.services }}"
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
      protocol: TCP
        {{- end }}