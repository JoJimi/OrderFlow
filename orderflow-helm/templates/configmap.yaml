apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: {{ .Values.namespace }}
  labels:
    app: orderflow
    component: config
  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.infrastructure }}"
data:
  # Spring Profile
  SPRING_PROFILES_ACTIVE: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"

  # Database Configuration
  DB_HOST: "postgres"
  DB_PORT: "5432"
  POSTGRES_USER: "{{ .Values.env.POSTGRES_USER }}"
  POSTGRES_DB: "{{ .Values.postgresql.database.name }}"

  # Redis Configuration
  REDIS_HOST: "{{ .Values.env.REDIS_HOST }}"
  REDIS_PORT: "{{ .Values.env.REDIS_PORT }}"
  REDIS_PROTOCOL: "redis"

  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.env.KAFKA_BOOTSTRAP_SERVERS }}"
  KAFKA_BROKER_HOST: "kafka"
  KAFKA_BROKER_PORT: "29092"

  # Eureka Configuration
  EUREKA_SERVER_URL: "{{ .Values.env.EUREKA_SERVER_URL }}"
  EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
  EUREKA_CLIENT_FETCH_REGISTRY: "true"

  # Application Configuration
  JWT_ACCESS_EXPIRATION: "{{ .Values.env.JWT_ACCESS_EXPIRATION }}"
  JWT_REFRESH_EXPIRATION: "{{ .Values.env.JWT_REFRESH_EXPIRATION }}"
  FRONT_BASE_URL: "{{ .Values.env.FRONT_BASE_URL }}"

  # JPA Configuration
  JPA_HIBERNATE_DDL_AUTO: "validate"
  JPA_SHOW_SQL: "false"

  # Connection Pool
  DB_POOL_SIZE: "10"
  DB_MIN_IDLE: "3"

  # Logging
  LOG_LEVEL_ROOT: "WARN"
  LOG_LEVEL_APP: "INFO"